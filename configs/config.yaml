# Konfigurasi utama proyek. Semua path, tahun, dan parameter ada di sini.
# Loader: src/karhutla/config.py (validasi pydantic, field tak dikenal ditolak).

project: karhutla-kaltim
seed: 42

paths:
  data_raw: data/raw
  data_interim: data/interim
  data_processed: data/processed
  reports: reports

region:
  province: "Kalimantan Timur"
  bbox_buffer_deg: 0.1

grid:
  resolution_deg: 0.05
  min_area_fraction: 0.0         # buang sel jika fraksi luas di dalam provinsi <= nilai ini

time:
  start_date: "2012-01-23"      # TODO(verify): tanggal awal data VIIRS S-NPP
  week_convention: "iso"
  horizon_weeks: 1

split:
  train: [2012, 2021]
  val: [2022, 2022]
  test: [2023, 2025]
  production_sim: [2026, 2026]

labels:
  sensor: "VIIRS_SNPP"
  confidence_keep: ["n", "h"]   # TODO(verify): kode confidence di data arsip (OQ-1)
  static_source:
    cluster_eps_m: 500
    min_active_months: 12       # placeholder, tentukan dari analisis F-3.1
    min_active_years: 3         # placeholder

features:
  era5_latency_days: 6          # TODO(verify): OQ-2
  rain_windows_days: [7, 30, 90]
  hotspot_lags_weeks: [1, 2, 3, 4]

evaluation:
  top_k_percent: [5, 10]

sources:
  admin:
    # OQ-4 (diverifikasi 2026-11-01): OCHA COD-AB Indonesia, sumber BPS, lisensi CC BY-IGO.
    # Layer idn_admin2 berisi 522 kabupaten/kota (valid_on 2020-04-01, version v01),
    # Kaltim = 10 unit (pcode ID64xx) termasuk Mahakam Ulu (dieja "Mahakam Hulu" di sumber),
    # Kaltara sudah terpisah (ID65xx). Nama layer dan kolom dibaca langsung dari file.
    name: "OCHA COD-AB Indonesia (BPS)"
    url: "https://data.humdata.org/dataset/84a1d98a-790b-4d66-9d14-bbfa48500802/resource/c740a308-0a63-46d6-ab15-b041e62eff58/download/idn_admin_boundaries.gdb.zip"
    raw_filename: "idn_admin_boundaries.gdb.zip"
    layer: "idn_admin2"
    province_col: "adm1_name"
    name_col: "adm2_name"
    pcode_col: "adm2_pcode"
    expected_adm2_count: 10
