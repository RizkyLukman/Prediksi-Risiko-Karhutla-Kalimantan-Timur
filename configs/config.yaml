# Konfigurasi utama proyek. Semua path, tahun, dan parameter ada di sini.
# Loader: src/karhutla/config.py (validasi pydantic, field tak dikenal ditolak).

project: karhutla-kaltim
seed: 42

paths:
  data_raw: data/raw
  data_interim: data/interim
  data_processed: data/processed
  reports: reports

region:
  province: "Kalimantan Timur"
  bbox_buffer_deg: 0.1

grid:
  resolution_deg: 0.05
  min_area_fraction: 0.0         # buang sel jika fraksi luas di dalam provinsi <= nilai ini

time:
  start_date: "2012-01-23"      # Senin pertama setelah awal arsip VIIRS S-NPP (20 Jan 2012, diverifikasi 2026-11-01)
  week_convention: "iso"
  horizon_weeks: 1

split:
  train: [2012, 2021]
  val: [2022, 2022]
  test: [2023, 2025]
  production_sim: [2026, 2026]

labels:
  sensor: "VIIRS_SNPP"
  confidence_keep: ["n", "h"]   # kode l/n/h dikonfirmasi dari respons API VIIRS_SNPP_SP (OQ-1, 2026-11-01)
  static_source:
    cluster_eps_m: 500
    min_active_months: 12       # placeholder, tentukan dari analisis F-3.1
    min_active_years: 3         # placeholder

features:
  era5_latency_days: 6          # TODO(verify): OQ-2
  rain_windows_days: [7, 30, 90]
  hotspot_lags_weeks: [1, 2, 3, 4]

evaluation:
  top_k_percent: [5, 10]

sources:
  admin:
    # OQ-4 (diverifikasi 2026-11-01): OCHA COD-AB Indonesia, sumber BPS, lisensi CC BY-IGO.
    # Layer idn_admin2 berisi 522 kabupaten/kota (valid_on 2020-04-01, version v01),
    # Kaltim = 10 unit (pcode ID64xx) termasuk Mahakam Ulu (dieja "Mahakam Hulu" di sumber),
    # Kaltara sudah terpisah (ID65xx). Nama layer dan kolom dibaca langsung dari file.
    name: "OCHA COD-AB Indonesia (BPS)"
    url: "https://data.humdata.org/dataset/84a1d98a-790b-4d66-9d14-bbfa48500802/resource/c740a308-0a63-46d6-ab15-b041e62eff58/download/idn_admin_boundaries.gdb.zip"
    raw_filename: "idn_admin_boundaries.gdb.zip"
    layer: "idn_admin2"
    province_col: "adm1_name"
    name_col: "adm2_name"
    pcode_col: "adm2_pcode"
    expected_adm2_count: 10
  firms:
    # OQ-1 (diverifikasi 2026-11-01 dari firms.modaps.eosdis.nasa.gov/api/area dan
    # modaps.modaps.eosdis.nasa.gov VNP14IMGTDL_NRT): area API maks 5 hari per permintaan,
    # kuota 5000 transaksi / 10 menit per MAP_KEY. VIIRS_SNPP_SP = standard processing
    # (science quality), satu-satunya yang punya kolom `type` (0 presumed vegetation fire,
    # 1 active volcano, 2 other static land source, 3 offshore).
    # MAP_KEY dibaca dari variabel lingkungan FIRMS_MAP_KEY (lihat .env.example).
    api_base: "https://firms.modaps.eosdis.nasa.gov/api/area/csv"
    # CSV kolom data_id,min_date,max_date; dipakai agar potongan yang datanya belum rilis tidak di-cache kosong
    availability_base: "https://firms.modaps.eosdis.nasa.gov/api/data_availability/csv"
    source: "VIIRS_SNPP_SP"
    day_range: 5
    sleep_seconds: 0.2
    timezone: "Asia/Makassar"     # WITA (UTC+8) untuk tanggal lokal dan minggu ISO
